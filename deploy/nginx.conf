# ---------------------------------------------------------------------------
# Nginx config — Omid & Yalda wedding invitation (static site)
#
# 1. Replace `invite.example.ir` with your domain and `root` with the folder
#    you uploaded the site to.
# 2. In the Pachim panel, paste the `server { ... }` blocks into the site's
#    custom Nginx config (or drop this file into /etc/nginx/conf.d/).
# 3. Test and reload:  nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name invite.example.ir;

    # Let's Encrypt HTTP challenge (keep if the panel issues certificates)
    location ^~ /.well-known/acme-challenge/ { root /var/www/omid-yalda-invite; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # Works on every nginx version (on >= 1.25.1 you may instead write
    # `listen 443 ssl;` + `http2 on;` to silence the deprecation warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invite.example.ir;

    # Certificates (usually managed by the panel)
    ssl_certificate     /etc/letsencrypt/live/invite.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invite.example.ir/privkey.pem;

    root  /var/www/omid-yalda-invite;
    index index.html;
    charset utf-8;

    # Never serve dev/source files
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(scripts|deploy|reference|node_modules|assets/gallery/raw)/ { deny all; }
    location ~ ^/(package(-lock)?\.json|README\.md|PROMPT\.md)$ { deny all; }

    # --- MIME types ----------------------------------------------------------
    # Older nginx builds lack some of these; on newer ones nginx -t prints a
    # harmless "duplicate extension" warning.
    include mime.types;
    types {
        text/calendar   ics;
        image/webp      webp;
        font/woff2      woff2;
        image/svg+xml   svg svgz;
        audio/mpeg      mp3;
    }

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/calendar
        application/javascript text/javascript application/json
        image/svg+xml application/xml;
    # (woff2 / webp / jpg / mp3 are already compressed — no gzip)

    # Brotli — only if the ngx_brotli module is installed:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_static on;
    # brotli_types text/plain text/css text/calendar application/javascript
    #              text/javascript application/json image/svg+xml application/xml;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Caching -------------------------------------------------------------
    # HTML: always revalidate so edits show up immediately.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets: long cache. When you change css/js after guests have
    # visited, bump a query string in index.html (e.g. style.css?v=2).
    location ~ ^/(assets|css|js)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Fonts never change — cache for a year.
    location ^~ /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Music: allow range requests (iOS needs them for <audio>)
    location = /assets/music.mp3 {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Accept-Ranges bytes always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
